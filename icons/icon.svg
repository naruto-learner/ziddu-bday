<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:#c471ed"/>
    </linearGradient>
    <linearGradient id="cake" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="50%" style="stop-color:#e8b888"/>
      <stop offset="100%" style="stop-color:#f0c898"/>
    </linearGradient>
    <linearGradient id="frosting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f8"/>
      <stop offset="100%" style="stop-color:#ffeef3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Cake plate -->
  <ellipse cx="256" cy="400" rx="140" ry="20" fill="#e8d5c4"/>
  <!-- Cake bottom layer -->
  <path d="M130 400 L110 340 Q110 320 130 320 L382 320 Q402 320 402 340 L382 400 Z" fill="url(#cake)"/>
  <!-- Frosting between layers -->
  <path d="M130 320 Q130 310 150 310 L362 310 Q382 310 382 320 L382 320 Q382 330 362 330 L150 330 Q130 330 130 320" fill="url(#frosting)"/>
  <!-- Cake middle layer -->
  <path d="M150 320 L138 270 Q138 250 158 250 L354 250 Q374 250 374 270 L362 320 Z" fill="url(#cake)"/>
  <!-- Frosting top -->
  <path d="M158 250 Q158 240 178 240 L334 240 Q354 240 354 250 L354 250 Q354 260 334 260 L178 260 Q158 260 158 250" fill="url(#frosting)"/>
  <!-- Cake top layer -->
  <path d="M178 250 L170 210 Q170 190 190 190 L322 190 Q342 190 342 210 L334 250 Z" fill="url(#cake)"/>
  <!-- Top frosting -->
  <ellipse cx="256" cy="185" rx="76" ry="12" fill="url(#frosting)"/>
  <!-- Sprinkles -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="185" x2="200" y2="175" stroke="#ff6b9d"/>
    <line x1="230" y1="180" x2="230" y2="170" stroke="#4ecdc4"/>
    <line x1="260" y1="178" x2="260" y2="168" stroke="#ffe66d"/>
    <line x1="290" y1="180" x2="290" y2="170" stroke="#c471ed"/>
    <line x1="310" y1="185" x2="310" y2="175" stroke="#ff9f43"/>
    <line x1="215" y1="188" x2="215" y2="178" stroke="#ff6b9d"/>
    <line x1="275" y1="186" x2="275" y2="176" stroke="#4ecdc4"/>
  </g>
  <!-- Candles -->
  <g>
    <!-- Candle 1 -->
    <rect x="210" y="130" width="12" height="55" rx="3" fill="#ffefc4"/>
    <rect x="212" y="135" width="8" height="45" fill="url(#cake)"/>
    <path d="M216 130 Q210 110 216 95 Q222 110 216 130" fill="#ffdb4d" filter="url(#glow)"/>
    <ellipse cx="216" cy="95" rx="8" ry="4" fill="#ff8c00" opacity="0.6"/>
    <!-- Candle 2 -->
    <rect x="250" y="125" width="12" height="60" rx="3" fill="#ffefc4"/>
    <rect x="252" y="130" width="8" height="50" fill="url(#cake)"/>
    <path d="M256 125 Q250 105 256 90 Q262 105 256 125" fill="#ffdb4d" filter="url(#glow)"/>
    <ellipse cx="256" cy="90" rx="8" ry="4" fill="#ff8c00" opacity="0.6"/>
    <!-- Candle 3 -->
    <rect x="290" y="130" width="12" height="55" rx="3" fill="#ffefc4"/>
    <rect x="292" y="135" width="8" height="45" fill="url(#cake)"/>
    <path d="M296 130 Q290 110 296 95 Q302 110 296 130" fill="#ffdb4d" filter="url(#glow)"/>
    <ellipse cx="296" cy="95" rx="8" ry="4" fill="#ff8c00" opacity="0.6"/>
  </g>
  <!-- "3" on cake -->
  <text x="256" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="80" font-weight="800" fill="#fff" opacity="0.3">3</text>
</svg>